# Local development only. Ports are bound to your own computer.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: netrunner
      POSTGRES_USER: netrunner
      POSTGRES_PASSWORD: netrunner-local-only
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U netrunner -d netrunner']
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PGHOST: db
      PGDATABASE: netrunner
      PGUSER: netrunner
      PGPASSWORD: netrunner-local-only
      DJANGO_DEBUG: '1'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:${NETRUNNER_HTTP_PORT:-5173},http://127.0.0.1:${NETRUNNER_HTTP_PORT:-5173}
    depends_on:
      db:
        condition: service_healthy
    command: [sh, -c, 'python backend/manage.py migrate --noinput && python backend/manage.py runserver 0.0.0.0:8000 --noreload']
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NETRUNNER_API_TARGET: http://backend:8000
    ports:
      - '127.0.0.1:${NETRUNNER_HTTP_PORT:-5173}:5173'
    depends_on:
      - backend
